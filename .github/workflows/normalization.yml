name: Normalization qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: normalizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Linux isolated normalization
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install coordinator and standalone parser test closure
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --require-hashes -r components/normalizer/requirements.lock
          pip install --no-deps -e .
      - name: Build exact immutable worker
        run: |
          docker build --iidfile "$RUNNER_TEMP/normalizer-image" -f components/normalizer/Dockerfile .
          echo "NORMALIZER_TEST_IMAGE=$(cat "$RUNNER_TEMP/normalizer-image")" >> "$GITHUB_ENV"
      - name: Qualify actual sandbox and every ingress
        run: bash scripts/qualify_normalizer.sh "$NORMALIZER_TEST_IMAGE"
      - name: Deterministic normalization property corpus
        run: pytest -q tests/fuzz/test_fuzz_normalization.py --hypothesis-seed=0
